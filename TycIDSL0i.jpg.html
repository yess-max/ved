    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    /* =================================================
       PENGATURAN POSISI BANNER
       ================================================= */

    :root {

      /* Banner ATAS */
      --banner-atas: 20px;

      /* Banner BAWAH
         0px = paling bawah video
         -30px = naik 30px
         -60px = naik 60px
      */
      --banner-bawah: -55px;

      /* Lebar maksimal video PC */
      --max-video: 900px;
    }


    /* =================================================
       VIDEO WRAPPER
       ================================================= */

    .video-wrapper {
      position: relative;

      width: 100%;
      max-width: var(--max-video);

      margin: 0 auto;
    }


    /* =================================================
       VIDEO RESPONSIVE
       ================================================= */

    video {
      display: block;

      width: 100%;
      height: auto;

      aspect-ratio: 16 / 9;

      object-fit: contain;

      background: #000;
    }


    /* =================================================
       BANNER UMUM
       ================================================= */

    .banner {
      position: absolute;

      left: 50%;

      width: 100%;

      text-align: center;

      z-index: 999999;

      transform: translateX(-50%);

      pointer-events: auto;

      overflow: visible;
    }


    /* =================================================
       BANNER ATAS
       ================================================= */

    .banner-atas {
      top: var(--banner-atas);
    }


    /* =================================================
       BANNER BAWAH
       ================================================= */

    .banner-bawah {
      /*
        Posisi dihitung dari bagian bawah video
      */
      bottom: var(--banner-bawah);
    }


    /* =================================================
       HP
       ================================================= */

    @media (max-width: 600px) {

      :root {
        --banner-atas: 10px;
        --banner-bawah: -50px;
      }

      .video-wrapper {
        width: 100%;
      }

    }

  </style>
</head>
