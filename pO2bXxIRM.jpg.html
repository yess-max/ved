      margin: 0;

      background: #000;

    }

    /* ==================================================
       PENGATURAN MUDAH
       ================================================== */

    :root {
      /* Posisi banner atas */
      --banner-atas-turun: 20px;

      /* Posisi banner bawah */
      --banner-bawah-turun: 40px;

      /* Jarak video dari sisi layar */
      --jarak-video: 10px;

      /* Ukuran maksimal video di laptop/PC */
      --max-video: 900px;
    }


    /* ==================================================
       LAYOUT
       ================================================== */

    .page {
      width: 100%;
      display: flex;
      flex-direction: column;
    }


    /* ==================================================
       BANNER
       ================================================== */

    .banner {
      width: 100%;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Banner ATAS */
    .banner-top {
      order: 1;

      /* Ubah angka di :root */
      transform: translateY(var(--banner-atas-turun));
    }

    /* Banner BAWAH */
    .banner-bottom {
      order: 3;

      /* Ubah angka di :root */
      transform: translateY(var(--banner-bawah-turun));
    }


    /* ==================================================
       VIDEO RESPONSIVE
       ================================================== */

    .video-container {
      order: 2;

      width: 100%;
      max-width: var(--max-video);

      margin: 0 auto;
      padding: var(--jarak-video);
    }

    video {
      display: block;

      width: 100%;
      height: auto;

      aspect-ratio: 16 / 9;

      object-fit: contain;

      background: #000;

      border-radius: 6px;
    }


    /* ==================================================
       HP
       ================================================== */

    @media (max-width: 600px) {

      .video-container {
        padding: 5px;
      }

      video {
        border-radius: 0;
      }

    }
  </style>
